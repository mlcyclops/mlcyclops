<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="t d">
  <title id="t">TL187://MISSION</title>
  <desc id="d">$ tl187 mission --brief. Map stakeholders, tech debt, outcomes: MAPPED. Build spec-driven agentic DevSecOps: GREEN. Gate prompt-injection scan, fail-closed: ARMED. Prove evals and evidence for ATO / cATO: PASS. Hand off training and change management: READY. Mission ready, human judgment in the loop.</desc>
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07101a"/>
      <stop offset="1" stop-color="#03060b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#a06bff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#a06bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="900" height="270" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="270" fill="url(#win)"/>
    <rect width="900" height="270" fill="url(#glow)"/>
    <rect width="900" height="36" fill="#ffffff" fill-opacity="0.025"/>
    <line x1="0" y1="36" x2="900" y2="36" stroke="#ffffff" stroke-opacity="0.07"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="269" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2">
    <circle cx="24" cy="18" r="5"/>
    <circle cx="42" cy="18" r="5"/>
    <circle cx="60" cy="18" r="5"/>
  </g>

  <g font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace">
    <text x="450" y="22" text-anchor="middle" fill="#556574" font-size="11" letter-spacing="2.4">TL187://MISSION</text>

    <!-- 14s loop: lines type in, hold, clear -->
    <g font-size="14.5">
      <text x="32" y="72" opacity="0">
        <tspan fill="#4fe08a">$</tspan><tspan fill="#ecf4fa"> tl187 mission --brief</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0357;0.0536;0.92;0.96;1" dur="14s" repeatCount="indefinite"/>
      </text>

      <g opacity="0">
        <text x="32" y="104" fill="#3ee8f0">›</text>
        <text x="50" y="104" fill="#ecf4fa" font-weight="700">map</text>
        <text x="118" y="104" fill="#a3b4c3">stakeholders, tech debt, outcomes</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.1179;0.92;0.96;1" dur="14s" repeatCount="indefinite"/>
      </g>
      <text x="470" y="104" fill="#4fe08a" font-weight="700" letter-spacing="1" opacity="0">MAPPED
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1321;0.15;0.92;0.96;1" dur="14s" repeatCount="indefinite"/>
      </text>

      <g opacity="0">
        <text x="32" y="131" fill="#3ee8f0">›</text>
        <text x="50" y="131" fill="#ecf4fa" font-weight="700">build</text>
        <text x="118" y="131" fill="#a3b4c3">spec-driven agentic DevSecOps</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1643;0.1821;0.92;0.96;1" dur="14s" repeatCount="indefinite"/>
      </g>
      <text x="470" y="131" fill="#4fe08a" font-weight="700" letter-spacing="1" opacity="0">GREEN
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1964;0.2143;0.92;0.96;1" dur="14s" repeatCount="indefinite"/>
      </text>

      <g opacity="0">
        <text x="32" y="158" fill="#3ee8f0">›</text>
        <text x="50" y="158" fill="#ecf4fa" font-weight="700">gate</text>
        <text x="118" y="158" fill="#a3b4c3">prompt-injection scan, fail-closed</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2286;0.2464;0.92;0.96;1" dur="14s" repeatCount="indefinite"/>
      </g>
      <text x="470" y="158" fill="#c86be0" font-weight="700" letter-spacing="1" opacity="0">ARMED
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2607;0.2786;0.92;0.96;1" dur="14s" repeatCount="indefinite"/>
      </text>

      <g opacity="0">
        <text x="32" y="185" fill="#3ee8f0">›</text>
        <text x="50" y="185" fill="#ecf4fa" font-weight="700">prove</text>
        <text x="118" y="185" fill="#a3b4c3">evals + evidence for ATO / cATO</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2929;0.3107;0.92;0.96;1" dur="14s" repeatCount="indefinite"/>
      </g>
      <text x="470" y="185" fill="#3ee8f0" font-weight="700" letter-spacing="1" opacity="0">PASS
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.325;0.3429;0.92;0.96;1" dur="14s" repeatCount="indefinite"/>
      </text>

      <g opacity="0">
        <text x="32" y="212" fill="#3ee8f0">›</text>
        <text x="50" y="212" fill="#ecf4fa" font-weight="700">hand</text>
        <text x="118" y="212" fill="#a3b4c3">training + change management</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3571;0.375;0.92;0.96;1" dur="14s" repeatCount="indefinite"/>
      </g>
      <text x="470" y="212" fill="#e6c65c" font-weight="700" letter-spacing="1" opacity="0">READY
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3893;0.4071;0.92;0.96;1" dur="14s" repeatCount="indefinite"/>
      </text>

      <text x="32" y="244" opacity="0">
        <tspan fill="#4fe08a">✓</tspan><tspan fill="#00ffd1"> mission ready · human judgment in the loop</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4214;0.4393;0.92;0.96;1" dur="14s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="32" y="252" width="9" height="3" fill="#3ee8f0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Right rail: operating principle -->
  <line x1="600" y1="56" x2="600" y2="250" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="630" y="72" fill="#556574" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="2">OPERATING PRINCIPLE</text>
  <g font-family="Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-style="italic" fill="#ecf4fa">
    <text x="630" y="100">“Take the technology that wins</text>
    <text x="630" y="120">next and make it usable by the</text>
    <text x="630" y="140">force that fights now.”</text>
  </g>
  <g font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.2" text-anchor="middle" font-weight="700">
    <rect x="630" y="170" width="55" height="22" rx="6" fill="#4fe08a" fill-opacity="0.08" stroke="#4fe08a" stroke-opacity="0.4"/>
    <text x="657.5" y="184.5" fill="#4fe08a">TRUST</text>
    <rect x="691" y="170" width="90" height="22" rx="6" fill="#3ee8f0" fill-opacity="0.08" stroke="#3ee8f0" stroke-opacity="0.4"/>
    <text x="736" y="184.5" fill="#3ee8f0">DISCIPLINE</text>
    <rect x="787" y="170" width="78" height="22" rx="6" fill="#a06bff" fill-opacity="0.08" stroke="#a06bff" stroke-opacity="0.45"/>
    <text x="826" y="184.5" fill="#a06bff">DELIVERY</text>
    <rect x="630" y="200" width="139" height="22" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="699.5" y="214.5" fill="#a3b4c3">HUMAN-IN-THE-LOOP</text>
    <rect x="775" y="200" width="90" height="22" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="820" y="214.5" fill="#a3b4c3">ROI-MAPPED</text>
  </g>
</svg>
