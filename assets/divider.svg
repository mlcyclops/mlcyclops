<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28">
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="860" y2="0">
      <stop offset="0" stop-color="#4fe08a" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#4fe08a" stop-opacity="0.45"/>
      <stop offset="0.42" stop-color="#3ee8f0" stop-opacity="0.8"/>
      <stop offset="0.58" stop-color="#a06bff" stop-opacity="0.8"/>
      <stop offset="0.8" stop-color="#c86be0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c86be0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee8f0"/>
      <stop offset="0.5" stop-color="#a06bff"/>
      <stop offset="1" stop-color="#c86be0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <line x1="40" y1="14" x2="436" y2="14" stroke="url(#line)" stroke-width="1"/>
  <line x1="464" y1="14" x2="860" y2="14" stroke="url(#line)" stroke-width="1"/>

  <!-- prism node -->
  <path d="M450 4 L460 22 L440 22 Z" fill="#a06bff" fill-opacity="0.12" stroke="url(#tri)" stroke-width="1.6" stroke-linejoin="round" filter="url(#glow)">
    <animate attributeName="fill-opacity" values="0.12;0.35;0.12" dur="4s" repeatCount="indefinite"/>
  </path>

  <g opacity="0.55">
    <polygon points="180,14 184,10 188,14 184,18" fill="#4fe08a"/>
    <polygon points="300,14 303,11 306,14 303,17" fill="#3ee8f0"/>
    <polygon points="594,14 597,11 600,14 597,17" fill="#a06bff"/>
    <polygon points="712,14 716,10 720,14 716,18" fill="#c86be0"/>
  </g>
</svg>
