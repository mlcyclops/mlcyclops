<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<circle cx="32" cy="32" r="23" stroke="#00d4ff" stroke-width="3"/>
<line x1="9" y1="32" x2="55" y2="32" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
<ellipse cx="32" cy="32" rx="10" ry="23" stroke="#00d4ff" stroke-width="2" opacity="0.6">
  <animate attributeName="rx" values="23;2;23" dur="6s" repeatCount="indefinite"/>
</ellipse>
<circle cx="44" cy="20" r="2.5" fill="#00ff41" filter="url(#g)">
  <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
</circle>
</g>
</svg>
