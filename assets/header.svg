<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Nick Chadwick · TECHLEAD 187</title>
  <desc id="d">Exceptionally fast. Secure by design. Security-first agentic AI from edge to core. Founder of TECHLEAD 187 LLC and builder of LUCID Agent IDE.</desc>
  <!-- Design tokens shared with techlead187.com / lucid-agents.com / aiworkshopapps.com:
       bg #03060b · bg2 #07101a · ink #ecf4fa · dim #a3b4c3 · faint #556574
       cyan #3ee8f0 · teal #00ffd1 · violet #a06bff · magenta #c86be0 · green #4fe08a · gold #e6c65c -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03060b"/>
      <stop offset="1" stop-color="#07101a"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.12" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#3ee8f0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3ee8f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.84" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#a06bff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a06bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowM" cx="0.98" cy="1" r="0.4">
      <stop offset="0" stop-color="#c86be0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#c86be0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ee8f0"/>
      <stop offset="0.55" stop-color="#a06bff"/>
      <stop offset="1" stop-color="#c86be0"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="860" y2="0">
      <stop offset="0" stop-color="#3ee8f0" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#3ee8f0" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#a06bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c86be0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="prismStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee8f0"/>
      <stop offset="0.5" stop-color="#a06bff"/>
      <stop offset="1" stop-color="#c86be0"/>
    </linearGradient>
    <linearGradient id="prismFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecf4fa" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#3ee8f0" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ecf4fa" stop-opacity="0"/>
      <stop offset="1" stop-color="#ecf4fa" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#3ee8f0" stroke-opacity="0.045" stroke-width="0.6"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <rect width="900" height="300" fill="url(#grid)"/>
    <rect width="900" height="300" fill="url(#glowC)"/>
    <rect width="900" height="300" fill="url(#glowV)"/>
    <rect width="900" height="300" fill="url(#glowM)"/>
    <!-- scan sweep -->
    <rect x="0" y="0" width="900" height="1.5" fill="url(#edge)" opacity="0.6">
      <animate attributeName="y" values="0;298;0" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
  <line x1="40" y1="0.5" x2="860" y2="0.5" stroke="url(#edge)" stroke-width="1.2"/>

  <!-- ═══ Left: identity ═══ -->
  <g font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace">
    <text x="50" y="62" fill="#3ee8f0" font-size="11" letter-spacing="2.6">TL187://PROFILE  ·  SECURITY-FIRST AGENTIC AI</text>
  </g>

  <g font-family="Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
    <text x="50" y="117" fill="#ecf4fa" font-size="44" font-weight="800" letter-spacing="-0.8">Nick Chadwick</text>
    <text x="50" y="158" fill="url(#tag)" font-size="25" font-weight="700" letter-spacing="-0.3">Exceptionally fast. Secure by design.</text>
    <text x="50" y="190" fill="#a3b4c3" font-size="14">Founder, TECHLEAD 187 LLC  ·  Builder of LUCID Agent IDE  ·  Tampa, FL</text>
  </g>

  <!-- proof chips -->
  <g font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2" text-anchor="middle">
    <rect x="50" y="210" width="154" height="26" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#4fe08a" stroke-opacity="0.4"/>
    <text x="127" y="227" fill="#4fe08a">26+ YRS IN UNIFORM</text>
    <rect x="214" y="210" width="175" height="26" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#3ee8f0" stroke-opacity="0.4"/>
    <text x="301.5" y="227" fill="#3ee8f0">FIRST GCP IL5 ENCLAVE</text>
    <rect x="399" y="210" width="168" height="26" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#a06bff" stroke-opacity="0.45"/>
    <text x="483" y="227" fill="#a06bff">AI FIELDED IN COMBAT</text>
    <rect x="577" y="210" width="62" height="26" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#e6c65c" stroke-opacity="0.45"/>
    <text x="608" y="227" fill="#e6c65c">CISSP</text>
  </g>

  <text x="50" y="270" fill="#556574" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.4">techlead187.com  ·  lucid-agents.com  ·  aiworkshopapps.com  ·  @TechLead187</text>

  <!-- ═══ Right: LUCID prism (white beam in, fail-closed core, four rays out) ═══ -->
  <!-- incoming beam -->
  <line x1="600" y1="166" x2="714" y2="139" stroke="url(#beam)" stroke-width="3" filter="url(#glow)"/>
  <line x1="600" y1="166" x2="714" y2="139" stroke="#ecf4fa" stroke-width="1.2" stroke-dasharray="4 12" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="32;0" dur="0.9s" repeatCount="indefinite"/>
  </line>

  <!-- prism body -->
  <path d="M750 70 L815 195 L685 195 Z" fill="url(#prismFill)" stroke="url(#prismStroke)" stroke-width="2" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M750 84 L803 187 L697 187 Z" fill="none" stroke="#ecf4fa" stroke-opacity="0.08"/>

  <!-- internal dispersion -->
  <g stroke-width="1" opacity="0.5">
    <line x1="714" y1="139" x2="777" y2="122" stroke="#4fe08a"/>
    <line x1="714" y1="139" x2="781" y2="130" stroke="#3ee8f0"/>
    <line x1="714" y1="139" x2="785" y2="137" stroke="#a06bff"/>
    <line x1="714" y1="139" x2="789" y2="145" stroke="#c86be0"/>
  </g>

  <!-- fail-closed padlock core -->
  <g stroke="#00ffd1" stroke-width="2" fill="none" filter="url(#glow)">
    <rect x="739" y="157" width="22" height="17" rx="3" fill="#00ffd1" fill-opacity="0.16"/>
    <path d="M743.5 157 V152 A6.5 6.5 0 0 1 756.5 152 V157"/>
  </g>
  <rect x="749" y="162" width="2" height="6" rx="1" fill="#00ffd1"/>

  <!-- outgoing rays -->
  <g stroke-width="2.6" stroke-linecap="round" filter="url(#glow)">
    <line x1="777" y1="122" x2="888" y2="92" stroke="#4fe08a">
      <animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="781" y1="130" x2="888" y2="124" stroke="#3ee8f0">
      <animate attributeName="opacity" values="1;0.35;1" dur="3s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="785" y1="137" x2="888" y2="156" stroke="#a06bff">
      <animate attributeName="opacity" values="1;0.35;1" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="789" y1="145" x2="888" y2="188" stroke="#c86be0">
      <animate attributeName="opacity" values="1;0.35;1" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <g font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="750" y="228" fill="#3ee8f0" font-size="10.5" letter-spacing="3">LUCID AGENT IDE</text>
    <text x="750" y="246" fill="#556574" font-size="9" letter-spacing="1.8">FAIL-CLOSED · ANY MODEL · ANY CLOUD</text>
  </g>
</svg>
